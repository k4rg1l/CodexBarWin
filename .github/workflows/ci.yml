name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CodexBarWin.csproj -r win-x64

      - name: Build
        run: dotnet build CodexBarWin.csproj -c Release -r win-x64 --no-restore /p:WindowsPackageType=None
